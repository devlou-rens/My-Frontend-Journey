<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
</head>
<body>
    <button onclick="addMessage()">Add</button>
    <button onclick="removeMessage()">Remove</button>

    <script>
        let messages = 2;
        let intervalId;
        
        const updateTitle = () =>{
            if (messages > 0){
            document.title = `(${messages}) New Messages`;
            } else {
                document.title = 'App'
            }
        }
        const startInterval = () => {
            if (!intervalId){
                intervalId = setInterval(updateTitle, 1000);
            }
        }
        
        const stopInterval = () => {
            clearInterval(intervalId);
            intervalId = null;
        }

        const addMessage = () => {
            messages++;
            startInterval()
        }
        const removeMessage = () => {
            if (messages > 0) {
                messages--;
            }

            if (messages === 0) {
                stopInterval();
                document.title = 'App';
            }
        }
        startInterval();
    </script>
</body>
</html>
